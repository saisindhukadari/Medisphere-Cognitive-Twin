spring.application.name=medisphere-backend
server.port=${SERVER_PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medisphere}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
medisphere.kafka.enabled=${KAFKA_ENABLED:false}
medisphere.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef0123456789abcdef}
medisphere.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
medisphere.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
medisphere.seed.enabled=${SEED_ENABLED:true}
medisphere.simulator.enabled=${SIMULATOR_ENABLED:true}
medisphere.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4300,http://localhost:4200}
app.synthetic-data-disclaimer=All patient data shown are synthetic and for demonstration only.
